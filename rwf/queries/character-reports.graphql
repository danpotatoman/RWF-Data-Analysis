query CharacterReports($name: String!, $serverSlug: String!, $serverRegion: String!, $page: Int!) {
  characterData { character(name: $name, serverSlug: $serverSlug, serverRegion: $serverRegion) {
    id canonicalID name hidden
    server { id slug blizzardID region { id name } }
    recentReports(page: $page, limit: 100) {
      current_page has_more_pages
      data { code startTime endTime revision visibility }
    }
  } }
  rateLimitData { limitPerHour pointsSpentThisHour pointsResetIn }
}
